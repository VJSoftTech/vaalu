<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="60%" y2="100%">
    <stop offset="0%"   stop-color="#052E16"/>
    <stop offset="55%"  stop-color="#14532D"/>
    <stop offset="100%" stop-color="#166534"/>
  </linearGradient>
  <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#022C16" stop-opacity="0.82"/>
    <stop offset="100%" stop-color="#022C16" stop-opacity="0.96"/>
  </linearGradient>
  <linearGradient id="bottombar" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#022C16" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#022C16" stop-opacity="1"/>
  </linearGradient>
  <filter id="ts" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.8)"/>
  </filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>text { font-family:'Noto Serif Tamil','Noto Sans Tamil','Latha','Tamil MN',serif; }</style>
</defs>

<!-- background -->
<rect width="300" height="420" fill="url(#bg)"/>

<!-- illustration area (top) -->

  <!-- caduceus cross -->
  <rect x="141" y="40" width="18" height="110" rx="4" fill="rgba(80,220,120,0.35)"/>
  <rect x="100" y="75" width="100" height="18" rx="4" fill="rgba(80,220,120,0.35)"/>
  <!-- lotus petals -->
  <ellipse cx="150" cy="160" rx="40" ry="16" fill="rgba(100,220,140,0.3)"/>
  <path d="M110,160 Q150,128 190,160" fill="rgba(80,200,120,0.25)"/>
  <path d="M118,160 Q150,135 182,160" fill="rgba(100,220,140,0.3)"/>
  <path d="M128,160 Q150,142 172,160" fill="rgba(130,240,160,0.4)"/>
  <path d="M138,160 Q150,150 162,160" fill="rgba(160,255,180,0.55)"/>
  <!-- green sparkling dots -->
  <circle cx="42" cy="50" r="3" fill="rgba(80,220,120,0.5)"/><circle cx="258" cy="55" r="3" fill="rgba(80,220,120,0.5)"/><circle cx="30" cy="130" r="3" fill="rgba(80,220,120,0.5)"/><circle cx="268" cy="135" r="3" fill="rgba(80,220,120,0.5)"/><circle cx="65" cy="175" r="3" fill="rgba(80,220,120,0.5)"/><circle cx="235" cy="175" r="3" fill="rgba(80,220,120,0.5)"/>
  <!-- leaf sprigs -->
  <ellipse cx="68" cy="90" rx="18" ry="9" fill="rgba(40,160,80,0.4)" transform="rotate(-40,68,90)"/>
  <ellipse cx="232" cy="90" rx="18" ry="9" fill="rgba(40,160,80,0.4)" transform="rotate(40,232,90)"/>
  <line x1="68"  y1="90"  x2="55"  y2="75"  stroke="rgba(40,160,80,0.4)" stroke-width="1.5"/>
  <line x1="232" y1="90"  x2="245" y2="75"  stroke="rgba(40,160,80,0.4)" stroke-width="1.5"/>
  <text x="38"  y="48" font-size="12" fill="rgba(80,220,120,0.6)">✦</text>
  <text x="256" y="50" font-size="12" fill="rgba(80,220,120,0.6)">✦</text>

<!-- text panel -->
<rect x="0" y="195" width="300" height="225" fill="url(#panel)"/>

<!-- decorative border -->

  <rect x="10" y="10" width="280" height="400" rx="3" fill="none" stroke="#4ADE80" stroke-width="1.2" opacity="0.5"/>
  <rect x="14" y="14" width="272" height="392" rx="2" fill="none" stroke="#4ADE80" stroke-width="0.5" opacity="0.3"/>
  <circle cx="10" cy="10" r="3" fill="#4ADE80" opacity="0.6"/>
  <circle cx="290" cy="10" r="3" fill="#4ADE80" opacity="0.6"/>
  <circle cx="10" cy="410" r="3" fill="#4ADE80" opacity="0.6"/>
  <circle cx="290" cy="410" r="3" fill="#4ADE80" opacity="0.6"/>
  <line x1="10" y1="26" x2="30" y2="26" stroke="#4ADE80" stroke-width="1" opacity="0.5"/>
  <line x1="270" y1="26" x2="290" y2="26" stroke="#4ADE80" stroke-width="1" opacity="0.5"/>
  <line x1="10" y1="394" x2="30" y2="394" stroke="#4ADE80" stroke-width="1" opacity="0.5"/>
  <line x1="270" y1="394" x2="290" y2="394" stroke="#4ADE80" stroke-width="1" opacity="0.5"/>

<!-- category badge -->

  <rect x="18" y="18" width="110" height="24" rx="12" fill="rgba(0,0,0,0.5)"/>
  <text x="28" y="35" font-size="10.5" fill="#4ADE80" font-weight="600" letter-spacing="0.8">மருத்துவம்</text>

<!-- publisher top-right -->
<text x="282" y="35" text-anchor="end" font-size="9.5" fill="#BBF7D0" opacity="0.65" letter-spacing="0.5">வாலு பதிப்பகம்</text>

<!-- thin gold line separator -->
<line x1="30" y1="202" x2="270" y2="202" stroke="#4ADE80" stroke-width="0.8" opacity="0.4"/>

<!-- title -->
<text x="150" y="200" text-anchor="middle" font-size="21" font-weight="bold" fill="white" letter-spacing="0.4" filter="url(#ts)">எளிய சித்த</text>
<text x="150" y="232" text-anchor="middle" font-size="21" font-weight="bold" fill="white" letter-spacing="0.4" filter="url(#ts)">மருத்துவம்</text>
<text x="150" y="264" text-anchor="middle" font-size="21" font-weight="bold" fill="white" letter-spacing="0.4" filter="url(#ts)">குறிப்புகள்</text>

<!-- ornamental divider -->
<g opacity="0.6">
  <line x1="55"  y1="306" x2="120" y2="306" stroke="#4ADE80" stroke-width="0.8"/>
  <circle cx="150" cy="306" r="3" fill="#4ADE80"/>
  <line x1="180" y1="306" x2="245" y2="306" stroke="#4ADE80" stroke-width="0.8"/>
</g>

<!-- publisher name below divider -->
<text x="150" y="324" text-anchor="middle" font-size="12.5" fill="#BBF7D0" letter-spacing="1.5" opacity="0.85">வாலு பதிப்பகம்</text>

<!-- star rating -->
<polygon points="105,348 109.5,351 112,348 110,353 113,356 109.5,355 106,356 107,353" fill="#4ADE80" stroke="#4ADE80" stroke-width="0.8" opacity="0.9"/><polygon points="123,348 127.5,351 130,348 128,353 131,356 127.5,355 124,356 125,353" fill="#4ADE80" stroke="#4ADE80" stroke-width="0.8" opacity="0.9"/><polygon points="141,348 145.5,351 148,348 146,353 149,356 145.5,355 142,356 143,353" fill="#4ADE80" stroke="#4ADE80" stroke-width="0.8" opacity="0.9"/><polygon points="159,348 163.5,351 166,348 164,353 167,356 163.5,355 160,356 161,353" fill="#4ADE80" stroke="#4ADE80" stroke-width="0.8" opacity="0.9"/><polygon points="177,348 181.5,351 184,348 182,353 185,356 181.5,355 178,356 179,353" fill="#4ADE80" stroke="#4ADE80" stroke-width="0.8" opacity="0.9"/>
<text x="201" y="357" font-size="11" fill="#BBF7D0" opacity="0.8">4.8</text>

<!-- bottom bar -->
<rect x="0" y="393" width="300" height="27" fill="url(#bottombar)"/>
<line x1="0" y1="393" x2="300" y2="393" stroke="#4ADE80" stroke-width="0.6" opacity="0.4"/>
<text x="18"  y="411" font-size="9.5" fill="#BBF7D0" opacity="0.5">ISBN 9789388001010</text>
<text x="282" y="411" font-size="9.5" fill="#BBF7D0" opacity="0.5" text-anchor="end">vaalu.in</text>
</svg>