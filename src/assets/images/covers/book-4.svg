<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="60%" y2="100%">
    <stop offset="0%"   stop-color="#0F172A"/>
    <stop offset="55%"  stop-color="#1E3A8A"/>
    <stop offset="100%" stop-color="#1D4ED8"/>
  </linearGradient>
  <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#0A0F1E" stop-opacity="0.82"/>
    <stop offset="100%" stop-color="#0A0F1E" stop-opacity="0.96"/>
  </linearGradient>
  <linearGradient id="bottombar" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#0A0F1E" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#0A0F1E" stop-opacity="1"/>
  </linearGradient>
  <filter id="ts" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.8)"/>
  </filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>text { font-family:'Noto Serif Tamil','Noto Sans Tamil','Latha','Tamil MN',serif; }</style>
</defs>

<!-- background -->
<rect width="300" height="420" fill="url(#bg)"/>

<!-- illustration area (top) -->

  <!-- stacked books -->
  <!-- bottom stack -->
  <rect x="40" y="155" width="80" height="14" rx="2" fill="rgba(255,200,0,0.5)"/>
  <rect x="44" y="142" width="74" height="14" rx="2" fill="rgba(255,160,0,0.45)"/>
  <rect x="48" y="129" width="66" height="14" rx="2" fill="rgba(255,200,0,0.4)"/>
  <rect x="52" y="116" width="58" height="14" rx="2" fill="rgba(255,180,0,0.4)"/>
  <!-- right stack -->
  <rect x="180" y="155" width="80" height="14" rx="2" fill="rgba(100,180,255,0.45)"/>
  <rect x="184" y="142" width="74" height="14" rx="2" fill="rgba(80,160,255,0.4)"/>
  <rect x="188" y="129" width="66" height="14" rx="2" fill="rgba(100,180,255,0.4)"/>
  <!-- open book centre -->
  <path d="M90,170 Q150,140 210,170 L210,185 Q150,158 90,185 Z" fill="rgba(255,255,255,0.18)"/>
  <path d="M150,140 L150,185" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <!-- quill pen -->
  <path d="M240,50 Q220,90 230,130 Q225,120 215,115 Q228,100 220,85 Q240,60 240,50Z" fill="rgba(255,255,200,0.5)"/>
  <line x1="230" y1="130" x2="222" y2="150" stroke="rgba(255,255,200,0.4)" stroke-width="1.5"/>
  <!-- sparkles -->
  <text x="40"  y="70" font-size="16" fill="rgba(255,210,0,0.6)">✦</text>
  <text x="256" y="60" font-size="12" fill="rgba(255,210,0,0.5)">✦</text>
  <text x="130" y="55" font-size="10" fill="rgba(255,210,0,0.5)">✦</text>
  <text x="22"  y="130" font-size="8"  fill="rgba(255,210,0,0.4)">✦</text>

<!-- text panel -->
<rect x="0" y="195" width="300" height="225" fill="url(#panel)"/>

<!-- decorative border -->

  <rect x="10" y="10" width="280" height="400" rx="3" fill="none" stroke="#FCD34D" stroke-width="1.2" opacity="0.5"/>
  <rect x="14" y="14" width="272" height="392" rx="2" fill="none" stroke="#FCD34D" stroke-width="0.5" opacity="0.3"/>
  <circle cx="10" cy="10" r="3" fill="#FCD34D" opacity="0.6"/>
  <circle cx="290" cy="10" r="3" fill="#FCD34D" opacity="0.6"/>
  <circle cx="10" cy="410" r="3" fill="#FCD34D" opacity="0.6"/>
  <circle cx="290" cy="410" r="3" fill="#FCD34D" opacity="0.6"/>
  <line x1="10" y1="26" x2="30" y2="26" stroke="#FCD34D" stroke-width="1" opacity="0.5"/>
  <line x1="270" y1="26" x2="290" y2="26" stroke="#FCD34D" stroke-width="1" opacity="0.5"/>
  <line x1="10" y1="394" x2="30" y2="394" stroke="#FCD34D" stroke-width="1" opacity="0.5"/>
  <line x1="270" y1="394" x2="290" y2="394" stroke="#FCD34D" stroke-width="1" opacity="0.5"/>

<!-- category badge -->

  <rect x="18" y="18" width="164" height="24" rx="12" fill="rgba(0,0,0,0.5)"/>
  <text x="28" y="35" font-size="10.5" fill="#FCD34D" font-weight="600" letter-spacing="0.8">வரலாறு & நிகழ்வு</text>

<!-- publisher top-right -->
<text x="282" y="35" text-anchor="end" font-size="9.5" fill="#BFDBFE" opacity="0.65" letter-spacing="0.5">வாலு பதிப்பகம்</text>

<!-- thin gold line separator -->
<line x1="30" y1="202" x2="270" y2="202" stroke="#FCD34D" stroke-width="0.8" opacity="0.4"/>

<!-- title -->
<text x="150" y="200" text-anchor="middle" font-size="21" font-weight="bold" fill="white" letter-spacing="0.4" filter="url(#ts)">2026 சென்னை</text>
<text x="150" y="232" text-anchor="middle" font-size="21" font-weight="bold" fill="white" letter-spacing="0.4" filter="url(#ts)">சர்வதேசப்</text>
<text x="150" y="264" text-anchor="middle" font-size="21" font-weight="bold" fill="white" letter-spacing="0.4" filter="url(#ts)">புத்தகக்காட்சியில் வாரு</text>

<!-- ornamental divider -->
<g opacity="0.6">
  <line x1="55"  y1="306" x2="120" y2="306" stroke="#FCD34D" stroke-width="0.8"/>
  <circle cx="150" cy="306" r="3" fill="#FCD34D"/>
  <line x1="180" y1="306" x2="245" y2="306" stroke="#FCD34D" stroke-width="0.8"/>
</g>

<!-- publisher name below divider -->
<text x="150" y="324" text-anchor="middle" font-size="12.5" fill="#BFDBFE" letter-spacing="1.5" opacity="0.85">வாலு பதிப்பகம்</text>

<!-- star rating -->
<polygon points="105,348 109.5,351 112,348 110,353 113,356 109.5,355 106,356 107,353" fill="#FCD34D" stroke="#FCD34D" stroke-width="0.8" opacity="0.9"/><polygon points="123,348 127.5,351 130,348 128,353 131,356 127.5,355 124,356 125,353" fill="#FCD34D" stroke="#FCD34D" stroke-width="0.8" opacity="0.9"/><polygon points="141,348 145.5,351 148,348 146,353 149,356 145.5,355 142,356 143,353" fill="#FCD34D" stroke="#FCD34D" stroke-width="0.8" opacity="0.9"/><polygon points="159,348 163.5,351 166,348 164,353 167,356 163.5,355 160,356 161,353" fill="#FCD34D" stroke="#FCD34D" stroke-width="0.8" opacity="0.9"/><polygon points="177,348 181.5,351 184,348 182,353 185,356 181.5,355 178,356 179,353" fill="none" stroke="#FCD34D" stroke-width="0.8" opacity="0.9"/>
<text x="201" y="357" font-size="11" fill="#BFDBFE" opacity="0.8">4.3</text>

<!-- bottom bar -->
<rect x="0" y="393" width="300" height="27" fill="url(#bottombar)"/>
<line x1="0" y1="393" x2="300" y2="393" stroke="#FCD34D" stroke-width="0.6" opacity="0.4"/>
<text x="18"  y="411" font-size="9.5" fill="#BFDBFE" opacity="0.5">ISBN 9789388001004</text>
<text x="282" y="411" font-size="9.5" fill="#BFDBFE" opacity="0.5" text-anchor="end">vaalu.in</text>
</svg>