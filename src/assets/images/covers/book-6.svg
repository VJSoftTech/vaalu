<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="60%" y2="100%">
    <stop offset="0%"   stop-color="#831843"/>
    <stop offset="55%"  stop-color="#BE185D"/>
    <stop offset="100%" stop-color="#E11D48"/>
  </linearGradient>
  <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#500724" stop-opacity="0.82"/>
    <stop offset="100%" stop-color="#500724" stop-opacity="0.96"/>
  </linearGradient>
  <linearGradient id="bottombar" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#500724" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#500724" stop-opacity="1"/>
  </linearGradient>
  <filter id="ts" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.8)"/>
  </filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>text { font-family:'Noto Serif Tamil','Noto Sans Tamil','Latha','Tamil MN',serif; }</style>
</defs>

<!-- background -->
<rect width="300" height="420" fill="url(#bg)"/>

<!-- illustration area (top) -->

  <!-- glow circles -->
  <circle cx="150" cy="105" r="80" fill="rgba(255,100,150,0.08)"/>
  <circle cx="150" cy="105" r="55" fill="rgba(255,80,130,0.07)"/>
  <!-- rose petals (simplified) -->
  <ellipse cx="150" cy="90" rx="28" ry="40" fill="rgba(220,50,100,0.7)" transform="rotate(-15,150,90)"/>
  <ellipse cx="165" cy="100" rx="26" ry="38" fill="rgba(200,40,90,0.7)" transform="rotate(20,165,100)"/>
  <ellipse cx="135" cy="100" rx="26" ry="38" fill="rgba(230,60,110,0.65)" transform="rotate(-20,135,100)"/>
  <ellipse cx="150" cy="115" rx="24" ry="35" fill="rgba(240,70,120,0.65)"/>
  <!-- centre -->
  <circle cx="150" cy="100" r="16" fill="rgba(255,100,140,0.9)"/>
  <circle cx="150" cy="100" r="9" fill="rgba(255,150,170,0.8)"/>
  <!-- leaves -->
  <ellipse cx="110" cy="145" rx="20" ry="10" fill="rgba(20,140,60,0.6)" transform="rotate(-30,110,145)"/>
  <ellipse cx="190" cy="145" rx="20" ry="10" fill="rgba(20,140,60,0.6)" transform="rotate(30,190,145)"/>
  <!-- stem -->
  <line x1="150" y1="135" x2="150" y2="185" stroke="rgba(30,120,30,0.6)" stroke-width="3"/>
  <!-- hearts -->
  <text x="50"  y="70" font-size="16" fill="rgba(255,150,180,0.6)">♥</text>
  <text x="235" y="80" font-size="13" fill="rgba(255,150,180,0.5)">♥</text>
  <text x="40"  y="150" font-size="11" fill="rgba(255,150,180,0.4)">♥</text>

<!-- text panel -->
<rect x="0" y="195" width="300" height="225" fill="url(#panel)"/>

<!-- decorative border -->

  <rect x="10" y="10" width="280" height="400" rx="3" fill="none" stroke="#F9A8D4" stroke-width="1.2" opacity="0.5"/>
  <rect x="14" y="14" width="272" height="392" rx="2" fill="none" stroke="#F9A8D4" stroke-width="0.5" opacity="0.3"/>
  <circle cx="10" cy="10" r="3" fill="#F9A8D4" opacity="0.6"/>
  <circle cx="290" cy="10" r="3" fill="#F9A8D4" opacity="0.6"/>
  <circle cx="10" cy="410" r="3" fill="#F9A8D4" opacity="0.6"/>
  <circle cx="290" cy="410" r="3" fill="#F9A8D4" opacity="0.6"/>
  <line x1="10" y1="26" x2="30" y2="26" stroke="#F9A8D4" stroke-width="1" opacity="0.5"/>
  <line x1="270" y1="26" x2="290" y2="26" stroke="#F9A8D4" stroke-width="1" opacity="0.5"/>
  <line x1="10" y1="394" x2="30" y2="394" stroke="#F9A8D4" stroke-width="1" opacity="0.5"/>
  <line x1="270" y1="394" x2="290" y2="394" stroke="#F9A8D4" stroke-width="1" opacity="0.5"/>

<!-- category badge -->

  <rect x="18" y="18" width="65" height="24" rx="12" fill="rgba(0,0,0,0.5)"/>
  <text x="28" y="35" font-size="10.5" fill="#F9A8D4" font-weight="600" letter-spacing="0.8">கவிதை</text>

<!-- publisher top-right -->
<text x="282" y="35" text-anchor="end" font-size="9.5" fill="#FBCFE8" opacity="0.65" letter-spacing="0.5">வாலு பதிப்பகம்</text>

<!-- thin gold line separator -->
<line x1="30" y1="202" x2="270" y2="202" stroke="#F9A8D4" stroke-width="0.8" opacity="0.4"/>

<!-- title -->
<text x="150" y="200" text-anchor="middle" font-size="21" font-weight="bold" fill="white" letter-spacing="0.4" filter="url(#ts)">தங்கமே எனக்கே</text>
<text x="150" y="232" text-anchor="middle" font-size="21" font-weight="bold" fill="white" letter-spacing="0.4" filter="url(#ts)">செல்லிரோய் -</text>
<text x="150" y="264" text-anchor="middle" font-size="21" font-weight="bold" fill="white" letter-spacing="0.4" filter="url(#ts)">கவிதை</text>

<!-- ornamental divider -->
<g opacity="0.6">
  <line x1="55"  y1="306" x2="120" y2="306" stroke="#F9A8D4" stroke-width="0.8"/>
  <circle cx="150" cy="306" r="3" fill="#F9A8D4"/>
  <line x1="180" y1="306" x2="245" y2="306" stroke="#F9A8D4" stroke-width="0.8"/>
</g>

<!-- publisher name below divider -->
<text x="150" y="324" text-anchor="middle" font-size="12.5" fill="#FBCFE8" letter-spacing="1.5" opacity="0.85">வாலு பதிப்பகம்</text>

<!-- star rating -->
<polygon points="105,348 109.5,351 112,348 110,353 113,356 109.5,355 106,356 107,353" fill="#F9A8D4" stroke="#F9A8D4" stroke-width="0.8" opacity="0.9"/><polygon points="123,348 127.5,351 130,348 128,353 131,356 127.5,355 124,356 125,353" fill="#F9A8D4" stroke="#F9A8D4" stroke-width="0.8" opacity="0.9"/><polygon points="141,348 145.5,351 148,348 146,353 149,356 145.5,355 142,356 143,353" fill="#F9A8D4" stroke="#F9A8D4" stroke-width="0.8" opacity="0.9"/><polygon points="159,348 163.5,351 166,348 164,353 167,356 163.5,355 160,356 161,353" fill="#F9A8D4" stroke="#F9A8D4" stroke-width="0.8" opacity="0.9"/><polygon points="177,348 181.5,351 184,348 182,353 185,356 181.5,355 178,356 179,353" fill="#F9A8D4" stroke="#F9A8D4" stroke-width="0.8" opacity="0.9"/>
<text x="201" y="357" font-size="11" fill="#FBCFE8" opacity="0.8">4.7</text>

<!-- bottom bar -->
<rect x="0" y="393" width="300" height="27" fill="url(#bottombar)"/>
<line x1="0" y1="393" x2="300" y2="393" stroke="#F9A8D4" stroke-width="0.6" opacity="0.4"/>
<text x="18"  y="411" font-size="9.5" fill="#FBCFE8" opacity="0.5">ISBN 9789388001006</text>
<text x="282" y="411" font-size="9.5" fill="#FBCFE8" opacity="0.5" text-anchor="end">vaalu.in</text>
</svg>