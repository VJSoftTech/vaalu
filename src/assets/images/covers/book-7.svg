<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="60%" y2="100%">
    <stop offset="0%"   stop-color="#083344"/>
    <stop offset="55%"  stop-color="#155E75"/>
    <stop offset="100%" stop-color="#0E7490"/>
  </linearGradient>
  <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#041C24" stop-opacity="0.82"/>
    <stop offset="100%" stop-color="#041C24" stop-opacity="0.96"/>
  </linearGradient>
  <linearGradient id="bottombar" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#041C24" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#041C24" stop-opacity="1"/>
  </linearGradient>
  <filter id="ts" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.8)"/>
  </filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>text { font-family:'Noto Serif Tamil','Noto Sans Tamil','Latha','Tamil MN',serif; }</style>
</defs>

