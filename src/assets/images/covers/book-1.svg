<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="60%" y2="100%">
    <stop offset="0%"   stop-color="#C2410C"/>
    <stop offset="55%"  stop-color="#EA580C"/>
    <stop offset="100%" stop-color="#FCD34D"/>
  </linearGradient>
  <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#7C1D06" stop-opacity="0.82"/>
    <stop offset="100%" stop-color="#7C1D06" stop-opacity="0.96"/>
  </linearGradient>
  <linearGradient id="bottombar" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#7C1D06" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#7C1D06" stop-opacity="1"/>
  </linearGradient>
  <filter id="ts" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.8)"/>
  </filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>text { font-family:'Noto Serif Tamil','Noto Sans Tamil','Latha','Tamil MN',serif; }</style>
</defs>

<!-- background -->
<rect width="300" height="420" fill="url(#bg)"/>

<!-- illustration area (top) -->

  <!-- sky -->
  <circle cx="150" cy="105" r="68" fill="rgba(255,230,0,0.18)"/>
  <!-- sun -->
  <circle cx="150" cy="105" r="46" fill="rgba(255,215,0,0.85)"/>
  <circle cx="150" cy="105" r="36" fill="rgba(255,235,100,0.9)"/>
  <!-- sun rays -->
  <line x1="202.0" y1="105.0" x2="218.0" y2="105.0" stroke="rgba(255,210,0,0.7)" stroke-width="3" stroke-linecap="round"/><line x1="195.0" y1="131.0" x2="208.9" y2="139.0" stroke="rgba(255,210,0,0.7)" stroke-width="3" stroke-linecap="round"/><line x1="176.0" y1="150.0" x2="184.0" y2="163.9" stroke="rgba(255,210,0,0.7)" stroke-width="3" stroke-linecap="round"/><line x1="150.0" y1="157.0" x2="150.0" y2="173.0" stroke="rgba(255,210,0,0.7)" stroke-width="3" stroke-linecap="round"/><line x1="124.0" y1="150.0" x2="116.0" y2="163.9" stroke="rgba(255,210,0,0.7)" stroke-width="3" stroke-linecap="round"/><line x1="105.0" y1="131.0" x2="91.1" y2="139.0" stroke="rgba(255,210,0,0.7)" stroke-width="3" stroke-linecap="round"/><line x1="98.0" y1="105.0" x2="82.0" y2="105.0" stroke="rgba(255,210,0,0.7)" stroke-width="3" stroke-linecap="round"/><line x1="105.0" y1="79.0" x2="91.1" y2="71.0" stroke="rgba(255,210,0,0.7)" stroke-width="3" stroke-linecap="round"/><line x1="124.0" y1="60.0" x2="116.0" y2="46.1" stroke="rgba(255,210,0,0.7)" stroke-width="3" stroke-linecap="round"/><line x1="150.0" y1="53.0" x2="150.0" y2="37.0" stroke="rgba(255,210,0,0.7)" stroke-width="3" stroke-linecap="round"/><line x1="176.0" y1="60.0" x2="184.0" y2="46.1" stroke="rgba(255,210,0,0.7)" stroke-width="3" stroke-linecap="round"/><line x1="195.0" y1="79.0" x2="208.9" y2="71.0" stroke="rgba(255,210,0,0.7)" stroke-width="3" stroke-linecap="round"/>
  <!-- clouds -->
  <ellipse cx="60" cy="75" rx="30" ry="16" fill="rgba(255,255,255,0.7)"/>
  <ellipse cx="80" cy="68" rx="22" ry="14" fill="rgba(255,255,255,0.75)"/>
  <ellipse cx="230" cy="80" rx="28" ry="15" fill="rgba(255,255,255,0.65)"/>
  <ellipse cx="248" cy="73" rx="20" ry="12" fill="rgba(255,255,255,0.7)"/>
  <!-- birds -->
  <path d="M48,50 Q55,44 62,50" stroke="rgba(255,255,255,0.9)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M68,58 Q75,52 82,58" stroke="rgba(255,255,255,0.9)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M210,48 Q217,42 224,48" stroke="rgba(255,255,255,0.9)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- rolling hills -->
  <path d="M0,170 Q75,130 150,160 Q225,185 300,150 L300,200 L0,200 Z" fill="rgba(0,100,0,0.25)"/>
  <!-- stars -->
  <text x="28" y="132" font-size="14" fill="rgba(255,255,255,0.8)">✦</text>
  <text x="260" y="118" font-size="11" fill="rgba(255,255,255,0.7)">✦</text>
  <text x="240" y="145" font-size="9" fill="rgba(255,255,255,0.6)">✦</text>
  <text x="40" y="155" font-size="9" fill="rgba(255,255,255,0.6)">✦</text>

<!-- text panel -->
<rect x="0" y="195" width="300" height="225" fill="url(#panel)"/>

<!-- decorative border -->

  <rect x="10" y="10" width="280" height="400" rx="3" fill="none" stroke="#FCD34D" stroke-width="1.2" opacity="0.5"/>
  <rect x="14" y="14" width="272" height="392" rx="2" fill="none" stroke="#FCD34D" stroke-width="0.5" opacity="0.3"/>
  <circle cx="10" cy="10" r="3" fill="#FCD34D" opacity="0.6"/>
  <circle cx="290" cy="10" r="3" fill="#FCD34D" opacity="0.6"/>
  <circle cx="10" cy="410" r="3" fill="#FCD34D" opacity="0.6"/>
  <circle cx="290" cy="410" r="3" fill="#FCD34D" opacity="0.6"/>
  <line x1="10" y1="26" x2="30" y2="26" stroke="#FCD34D" stroke-width="1" opacity="0.5"/>
  <line x1="270" y1="26" x2="290" y2="26" stroke="#FCD34D" stroke-width="1" opacity="0.5"/>
  <line x1="10" y1="394" x2="30" y2="394" stroke="#FCD34D" stroke-width="1" opacity="0.5"/>
  <line x1="270" y1="394" x2="290" y2="394" stroke="#FCD34D" stroke-width="1" opacity="0.5"/>

<!-- category badge -->

  <rect x="18" y="18" width="173" height="24" rx="12" fill="rgba(0,0,0,0.5)"/>
  <text x="28" y="35" font-size="10.5" fill="#FCD34D" font-weight="600" letter-spacing="0.8">சிறுவர் இலக்கியம்</text>

<!-- publisher top-right -->
<text x="282" y="35" text-anchor="end" font-size="9.5" fill="#FDE68A" opacity="0.65" letter-spacing="0.5">வாலு பதிப்பகம்</text>

<!-- thin gold line separator -->
<line x1="30" y1="202" x2="270" y2="202" stroke="#FCD34D" stroke-width="0.8" opacity="0.4"/>

<!-- title -->
<text x="150" y="200" text-anchor="middle" font-size="21" font-weight="bold" fill="white" letter-spacing="0.4" filter="url(#ts)">குட்டி தவளை</text>
<text x="150" y="232" text-anchor="middle" font-size="21" font-weight="bold" fill="white" letter-spacing="0.4" filter="url(#ts)">கோபாரு -</text>
<text x="150" y="264" text-anchor="middle" font-size="21" font-weight="bold" fill="white" letter-spacing="0.4" filter="url(#ts)">சிறுவர் பாடல்கள்</text>

<!-- ornamental divider -->
<g opacity="0.6">
  <line x1="55"  y1="306" x2="120" y2="306" stroke="#FCD34D" stroke-width="0.8"/>
  <circle cx="150" cy="306" r="3" fill="#FCD34D"/>
  <line x1="180" y1="306" x2="245" y2="306" stroke="#FCD34D" stroke-width="0.8"/>
</g>

<!-- publisher name below divider -->
<text x="150" y="324" text-anchor="middle" font-size="12.5" fill="#FDE68A" letter-spacing="1.5" opacity="0.85">வாலு பதிப்பகம்</text>

<!-- star rating -->
<polygon points="105,348 109.5,351 112,348 110,353 113,356 109.5,355 106,356 107,353" fill="#FCD34D" stroke="#FCD34D" stroke-width="0.8" opacity="0.9"/><polygon points="123,348 127.5,351 130,348 128,353 131,356 127.5,355 124,356 125,353" fill="#FCD34D" stroke="#FCD34D" stroke-width="0.8" opacity="0.9"/><polygon points="141,348 145.5,351 148,348 146,353 149,356 145.5,355 142,356 143,353" fill="#FCD34D" stroke="#FCD34D" stroke-width="0.8" opacity="0.9"/><polygon points="159,348 163.5,351 166,348 164,353 167,356 163.5,355 160,356 161,353" fill="#FCD34D" stroke="#FCD34D" stroke-width="0.8" opacity="0.9"/><polygon points="177,348 181.5,351 184,348 182,353 185,356 181.5,355 178,356 179,353" fill="#FCD34D" stroke="#FCD34D" stroke-width="0.8" opacity="0.9"/>
<text x="201" y="357" font-size="11" fill="#FDE68A" opacity="0.8">4.5</text>

<!-- bottom bar -->
<rect x="0" y="393" width="300" height="27" fill="url(#bottombar)"/>
<line x1="0" y1="393" x2="300" y2="393" stroke="#FCD34D" stroke-width="0.6" opacity="0.4"/>
<text x="18"  y="411" font-size="9.5" fill="#FDE68A" opacity="0.5">ISBN 9789388001001</text>
<text x="282" y="411" font-size="9.5" fill="#FDE68A" opacity="0.5" text-anchor="end">vaalu.in</text>
</svg>