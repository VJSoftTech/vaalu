<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Background -->
  <rect width="400" height="500" fill="#f3f4f6"/>

  <!-- Body / Shirt -->
  <ellipse cx="200" cy="480" rx="140" ry="90" fill="#d1d5db"/>
  <rect x="80" y="350" width="240" height="160" fill="#d1d5db" rx="10"/>

  <!-- Neck -->
  <rect x="175" y="290" width="50" height="70" fill="#c4a882" rx="5"/>

  <!-- Head -->
  <ellipse cx="200" cy="240" rx="90" ry="100" fill="#c4a882"/>

  <!-- Hair -->
  <ellipse cx="200" cy="150" rx="90" ry="55" fill="#2d2d2d"/>
  <rect x="110" y="150" width="18" height="50" fill="#2d2d2d" rx="8"/>
  <rect x="272" y="150" width="18" height="50" fill="#2d2d2d" rx="8"/>

  <!-- Eyes -->
  <ellipse cx="170" cy="240" rx="14" ry="12" fill="white"/>
  <ellipse cx="230" cy="240" rx="14" ry="12" fill="white"/>
  <circle cx="173" cy="241" r="8" fill="#2d2d2d"/>
  <circle cx="233" cy="241" r="8" fill="#2d2d2d"/>
  <circle cx="175" cy="239" r="3" fill="white"/>
  <circle cx="235" cy="239" r="3" fill="white"/>

  <!-- Eyebrows -->
  <path d="M155 224 Q170 218 186 224" stroke="#2d2d2d" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M214 224 Q230 218 245 224" stroke="#2d2d2d" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M200 255 Q192 272 196 278 Q200 280 204 278 Q208 272 200 255" fill="#b8956e"/>

  <!-- Smile -->
  <path d="M175 300 Q200 322 225 300" stroke="#8B5E3C" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Collar -->
