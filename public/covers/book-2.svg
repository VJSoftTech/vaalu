<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7E22CE"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="rgba(0,0,0,0.55)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.75)"/>
    </linearGradient>
    <style>
      text { font-family: 'Noto Serif Tamil', 'Noto Sans Tamil', 'Latha', 'Tamil MN', serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" fill="url(#bg)"/>

  <!-- Decorative elements -->
  
    <ellipse cx="260" cy="80"  rx="70" ry="50" fill="rgba(255,255,255,0.08)" transform="rotate(-20,260,80)"/>
    <ellipse cx="40"  cy="340" rx="60" ry="40" fill="rgba(255,255,255,0.07)" transform="rotate(15,40,340)"/>
    <line x1="0"   y1="160" x2="300" y2="160" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="0"   y1="170" x2="300" y2="170" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <circle cx="150" cy="50"  r="8" fill="rgba(255,255,255,0.18)"/>
    <circle cx="20"  cy="100" r="5" fill="rgba(255,255,255,0.15)"/>
    <circle cx="280" cy="380" r="6" fill="rgba(255,255,255,0.15)"/>

  <!-- Dark panel for text legibility -->
  <rect x="0" y="170" width="300" height="250" fill="url(#panel)"/>

  <!-- Thin border line -->
  <rect x="8" y="8" width="284" height="404" rx="4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Category badge -->
  <rect x="16" y="18" width="61" height="26" rx="13" fill="rgba(0,0,0,0.35)"/>
  <text x="24" y="36" font-size="11" fill="#F5D0FE" font-weight="700" letter-spacing="0.5">கவிதை</text>

  <!-- Title -->
  <text x="150" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">
    <tspan x="150" dy="0">காலை வணக்கம்</tspan><tspan x="150" dy="36">காதல் கவிதைகள்</tspan>
  </text>

  <!-- Divider -->
  <line x1="60" y1="291" x2="240" y2="291" stroke="#F5D0FE" stroke-width="1" opacity="0.6"/>

  <!-- Publisher name -->
  <text x="150" y="313" text-anchor="middle" font-size="13" fill="#F5D0FE" letter-spacing="1">வாலு பதிப்பகம்</text>

  <!-- Stars -->
  <text x="115" y="375" font-size="13" fill="#E879F9">★</text><text x="129" y="375" font-size="13" fill="#E879F9">★</text><text x="143" y="375" font-size="13" fill="#E879F9">★</text><text x="157" y="375" font-size="13" fill="#E879F9">★</text><text x="171" y="375" font-size="13" fill="#E879F9">☆</text>
  <text x="189" y="375" font-size="11" fill="rgba(255,255,255,0.7)">4.6</text>

  <!-- Bottom bar -->
  <rect x="0" y="395" width="300" height="25" fill="rgba(0,0,0,0.4)"/>
  <text x="16"  y="412" font-size="10" fill="rgba(255,255,255,0.5)">ISBN: 9789388001002</text>
  <text x="284" y="412" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="end">vaalu.in</text>
</svg>