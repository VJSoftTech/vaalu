<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#155E75"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="rgba(0,0,0,0.55)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.75)"/>
    </linearGradient>
    <style>
      text { font-family: 'Noto Serif Tamil', 'Noto Sans Tamil', 'Latha', 'Tamil MN', serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" fill="url(#bg)"/>

  <!-- Decorative elements -->
  
    <circle cx="150" cy="90"  r="65" fill="rgba(255,255,255,0.08)"/>
    <circle cx="150" cy="90"  r="45" fill="rgba(255,255,255,0.06)"/>
    <circle cx="150" cy="90"  r="25" fill="rgba(255,255,255,0.10)"/>
    <line x1="150" y1="25"  x2="150" y2="155" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <line x1="85"  y1="90"  x2="215" y2="90"  stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <line x1="104" y1="44"  x2="196" y2="136" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="196" y1="44"  x2="104" y2="136" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="30" cy="350" r="40" fill="rgba(255,255,255,0.06)"/>

  <!-- Dark panel for text legibility -->
  <rect x="0" y="170" width="300" height="250" fill="url(#panel)"/>

  <!-- Thin border line -->
  <rect x="8" y="8" width="284" height="404" rx="4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Category badge -->
  <rect x="16" y="18" width="106" height="26" rx="13" fill="rgba(0,0,0,0.35)"/>
  <text x="24" y="36" font-size="11" fill="#A5F3FC" font-weight="700" letter-spacing="0.5">பொது அறிவு</text>

  <!-- Title -->
  <text x="150" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">
    <tspan x="150" dy="0">வாழ்வில்</tspan><tspan x="150" dy="36">பொருள் - பொது</tspan><tspan x="150" dy="36">அறிவு கேள்வி</tspan>
  </text>

  <!-- Divider -->
  <line x1="60" y1="312" x2="240" y2="312" stroke="#A5F3FC" stroke-width="1" opacity="0.6"/>

  <!-- Publisher name -->
  <text x="150" y="334" text-anchor="middle" font-size="13" fill="#A5F3FC" letter-spacing="1">வாலு பதிப்பகம்</text>

  <!-- Stars -->
  <text x="115" y="375" font-size="13" fill="#22D3EE">★</text><text x="129" y="375" font-size="13" fill="#22D3EE">★</text><text x="143" y="375" font-size="13" fill="#22D3EE">★</text><text x="157" y="375" font-size="13" fill="#22D3EE">★</text><text x="171" y="375" font-size="13" fill="#22D3EE">☆</text>
  <text x="189" y="375" font-size="11" fill="rgba(255,255,255,0.7)">4.5</text>

  <!-- Bottom bar -->
  <rect x="0" y="395" width="300" height="25" fill="rgba(0,0,0,0.4)"/>
  <text x="16"  y="412" font-size="10" fill="rgba(255,255,255,0.5)">ISBN: 9789388001007</text>
  <text x="284" y="412" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="end">vaalu.in</text>
</svg>